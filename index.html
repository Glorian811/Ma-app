<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MAMBA — Personal Performance System</title>
  
  <!-- Tailwind CSS for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler to parse React components live in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-black text-white antialiased selection:bg-zinc-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // --- UTILITY CALCULATIONS ---
    function calculateMambaScore(input) {
      const score =
        input.goalCompletion * 0.25 +
        input.trainingAccuracy * 0.25 +
        input.consistency * 0.20 +
        input.weaknessAttack * 0.20 +
        input.reflection * 0.10;

      return Math.round(Math.min(100, Math.max(0, score)));
    }

    function chooseNextBattle(topics) {
      if (!topics.length) return null;

      const scored = topics.map((topic) => {
        const weakness = (100 - topic.accuracy) * 0.45;
        const lowMastery = (5 - topic.mastery) * 10 * 0.30;
        const neglect = Math.min(topic.daysSincePractice * 5, 30) * 0.15;
        const mistakes = Math.min(topic.mistakes * 3, 30) * 0.10;

        return {
          ...topic,
          score: weakness + lowMastery + neglect + mistakes,
        };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored[0];
    }

    // --- COMPONENTS ---
    function MambaScoreCard({ score }) {
      return (
        <div className="rounded-xl border border-zinc-800 bg-zinc-950/50 p-6">
          <p className="text-zinc-500 font-medium text-sm">Mamba Score</p>
          <p className="text-4xl font-black mt-2 text-emerald-400">{score}</p>
        </div>
      );
    }

    function AttackMode({ topic, onStart }) {
      return (
        <div className="rounded-2xl border border-zinc-700 bg-zinc-950 p-8">
          <p className="text-sm font-semibold tracking-wider text-zinc-500 uppercase">
            Your Next Battle
          </p>
          <h2 className="text-3xl font-bold mt-3">🐍 {topic}</h2>
          <p className="text-zinc-400 mt-3">
            This is currently one of your weakest areas based on performance algorithms.
          </p>
          <button
            onClick={onStart}
            className="mt-6 bg-white text-black hover:bg-zinc-200 transition-colors px-6 py-3 rounded-lg font-bold"
          >
            ATTACK
          </button>
        </div>
      );
    }

    function TodayMission() {
      return (
        <div className="rounded-xl border border-zinc-800 p-6 bg-zinc-950/30">
          <h3 className="text-lg font-bold text-zinc-200">Today's Mission</h3>
          <p className="text-sm text-zinc-400 mt-1">Complete 1 training session with &gt;85% accuracy.</p>
        </div>
      );
    }

    // --- MAIN DASHBOARD APP ---
    function Dashboard() {
      const [battleStatus, setBattleStatus] = useState("idle");

      // Sample dataset based on your topic model
      const sampleTopics = [
        { name: "Organic Chemistry", mastery: 2, accuracy: 62, mistakes: 5, daysSincePractice: 4 },
        { name: "Linear Algebra", mastery: 4, accuracy: 88, mistakes: 1, daysSincePractice: 1 },
        { name: "Thermodynamics", mastery: 1, accuracy: 45, mistakes: 8, daysSincePractice: 6 }
      ];

      const nextBattle = chooseNextBattle(sampleTopics);

      const currentScore = calculateMambaScore({
        goalCompletion: 70,
        trainingAccuracy: 82,
        consistency: 90,
        weaknessAttack: 60,
        reflection: 50,
      });

      return (
        <main className="min-h-screen max-w-6xl mx-auto p-8">
          <header className="mb-8">
            <h1 className="text-4xl font-extrabold tracking-tight">🐍 MAMBA</h1>
            <p className="text-zinc-400 mt-2 font-medium">Personal Performance System</p>
          </header>

          <section className="grid sm:grid-cols-2 md:grid-cols-4 gap-4">
            <MambaScoreCard score={currentScore} />

            <div className="rounded-xl border border-zinc-800 bg-zinc-950/50 p-6">
              <p className="text-zinc-500 font-medium text-sm">Training</p>
              <p className="text-3xl font-bold mt-2">0h</p>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-950/50 p-6">
              <p className="text-zinc-500 font-medium text-sm">Goals</p>
              <p className="text-3xl font-bold mt-2">0%</p>
            </div>

            <div className="rounded-xl border border-zinc-800 bg-zinc-950/50 p-6">
              <p className="text-zinc-500 font-medium text-sm">Weaknesses</p>
              <p className="text-3xl font-bold mt-2">
                {sampleTopics.filter(t => t.accuracy < 70).length}
              </p>
            </div>
          </section>

          <section className="mt-8 grid md:grid-cols-3 gap-6">
            <div className="md:col-span-2">
              {nextBattle && (
                <AttackMode
                  topic={nextBattle.name}
                  onStart={() => alert(`Starting Attack Mode session on: ${nextBattle.name}`)}
                />
              )}
            </div>

            <div className="md:col-span-1">
              <TodayMission />
            </div>
          </section>
        </main>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
